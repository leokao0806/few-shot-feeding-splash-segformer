DEVICE: cuda # device used for training and evaluation (cpu, cuda, cuda0, cuda1, ...)
SAVE_DIR: 'output_mvtec_bottle_segformer' # Output folder name, suggest naming by category
MODEL:
  NAME: SubclassSegFormer # Using the same model architecture as the previous work
  BACKBONE: MiT-B0 # Model variant
  PRETRAINED: 'checkpoints/pretrained/segformer/MiT-B0.pth' # Backbone model's weight
DATASET:
  NAME: MVTecDataset # ***[Modified]*** Dataset name, corresponds to the new class in dataset.py
  ROOT: 'C:/Users/user/PycharmProjects/MVTEC' # ***[Modified]*** Root directory of the MVTec AD dataset (Please change to your path)
  CATEGORY: 'bottle' # ***[Added]*** Category parameter required by MVTecDataset
  IGNORE_LABEL: 255 # Label to ignore during loss calculation
TRAIN:
  IMAGE_SIZE: [800, 800] # MVTec images have higher resolution, you can keep or adjust this size
  BATCH_SIZE: 4 # ***[Modified]*** MVTec images are larger, may need to reduce batch size
  EPOCHS: 300 # Number of epochs to train
  EVAL_INTERVAL: 1 # Evaluation interval during training
  AMP: false # Use Automatic Mixed Precision in training
  DDP: false # Use Distributed Data Parallel training
  AUG: True # Use data augmentation in training
LOSS:
  NAME: NLLLoss # Loss function name
  CLS_WEIGHTS: false # Use class weights in loss calculation
OPTIMIZER:
  NAME: adamw # Optimizer name
  LR: 0.0001 # Initial learning rate used in optimizer
  WEIGHT_DECAY: 0.01 # Weight decay rate used in optimizer
SCHEDULER:
  NAME: warmuppolylr # Scheduler name
  POWER: 0.9 # Scheduler power
  WARMUP: 10 # Warmup epochs used in scheduler
  WARMUP_RATIO: 0.1 # Warmup ratio
EVAL:
  MODEL_PATH: 'checkpoints/pretrained/segformer/MiT-B0.pth' # Trained model file path for evaluation
  IMAGE_SIZE: [800, 800] # Evaluation image size in (h, w)
  MSF:
    ENABLE: false # Enable multi-scale and flip evaluation
    FLIP: true # Use flip augmentation during MSF evaluation