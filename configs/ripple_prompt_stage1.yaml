DEVICE: cuda # device used for training and evaluation (cpu, cuda, cuda0, cuda1, ...)
SAVE_DIR: 'output_prompt' # output folder name used for saving the model, logs and inference results
MODEL:
  NAME: SubclassSegFormer_Unified # name of the model you are using
  BACKBONE: MiT-B0 # model variant
  PRETRAINED: 'checkpoints/pretrained/segformer/MiT-B0.pth' # backbone model's weight
  #'output_mix5_sb2L2AW_new64_aug10_noshuf_gain_drop02_f5_300/ripple_0/SubclassSegFormer_MiT-B0_ripple.pth'
DATASET:
  NAME: organized_ripple_4fold # dataset name to be trained with (camvid, cityscapes, ade20k)
  ROOT: 'C:/Users/user/PycharmProjects/organized_ripple_4fold' # dataset root path
  FIELD: 'barrel,sea,LNG,seabass_hmh,noon_jsj' #  field used in dataset #Stage2
  IGNORE_LABEL: 255
  SAMPLE_PER_FIELD: 10 # New 03/11
TRAIN:
  IMAGE_SIZE: [800, 800] # training image size in (h, w)
  BATCH_SIZE: 5 # batch size used to train
  EPOCHS: 300 # number of epochs to train
  EVAL_INTERVAL: 1 # evaluation interval during training
  AMP: false # use AMP in training
  DDP: false # use DDP training
  AUG: True # use data augmentation in training
LOSS:
  NAME: NLLLoss # loss function name (ohemce, ce, dice)CrossEntropy,NLLLoss,FocalNLLLoss, SubclassSignLoss
  CLS_WEIGHTS: false # use class weights in loss calculation
OPTIMIZER:
  NAME: adamw # optimizer name
  LR: 0.0001 # initial learning rate used in optimizer
  WEIGHT_DECAY: 0.01 # decay rate used in optimizer
SCHEDULER:
  NAME: warmuppolylr # scheduler name
  POWER: 0.9 # scheduler power
  WARMUP: 10 # warmup epochs used in scheduler
  WARMUP_RATIO: 0.1 # warmup ratio
EVAL:
  MODEL_PATH: 'checkpoints/pretrained/segformer/MiT-B0.pth' # trained model file path
  IMAGE_SIZE: [800, 800] # evaluation image size in (h, w)
  MSF:
    ENABLE: false # multi-scale and flip evaluation
    FLIP: true # use flip in evaluation
    SCALES: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75] # scales used in MSF evaluation
TEST:
  MODEL_PATH: 'checkpoints/pretrained/segformer/MiT-B0.pth' # trained model file path
  FILE: 'assests/ade' # filename or foldername
  IMAGE_SIZE: [800, 800] # inference image size in (h, w)
  OVERLAY: true # save the overlay result (image_alpha+label_alpha)
PROMPT_LEARNING:  # New 03/11
  MAPPER_LR: 0.005  # New 03/11